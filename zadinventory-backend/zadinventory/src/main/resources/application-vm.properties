# Perfil "vm": implantação em IaaS (Compute Engine) da Entrega 2.
# Ativado pelo serviço systemd com SPRING_PROFILES_ACTIVE=vm.
# Os valores vêm de /etc/zadinventory/zadinventory.env, gerado no boot a partir
# do Secret Manager. Nenhum segredo neste arquivo.

# Desliga o conector do Cloud SQL (usado só no deploy em Cloud Run).
spring.cloud.gcp.sql.enabled=false
spring.cloud.gcp.sql.instance-connection-name=
spring.cloud.gcp.sql.database-name=${DB_NAME:zadinventory}

# JDBC direto para a vm-db, com TLS obrigatório (o MySQL exige
# require_secure_transport=ON).
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:zadinventory}?sslMode=REQUIRED&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Sem SQL no log em produção.
spring.jpa.show-sql=false

server.port=8080

# Atrás do Nginx: usa X-Forwarded-Proto/For (proxy interno 10.10.1.20 é
# confiável por padrão). Assim o Spring vê https e o mesmo host da página,
# e o login do navegador deixa de ser tratado como CORS.
server.forward-headers-strategy=native
